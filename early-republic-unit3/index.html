<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Early Republic Classroom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a classroom chalkboard. Sticky tab rail of "rooms", one room visible at a time. Deliberately single-theme (dark board). */
:root{
  --board:#1d362f; --board-2:#25443b; --board-3:#2d5146;
  --chalk:#eef0e6; --chalk-dim:#b4c2b8; --line:rgba(238,240,230,.16);
  --yellow:#f2d675; --good:#9fe0a8; --bad:#f2a3a0; --wood:#6b4a2f;
  --f-display:"Cabin Sketch","Comic Sans MS",cursive;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--board);color:var(--chalk);font:16px/1.55 var(--f-body);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.05),transparent 60%),radial-gradient(ellipse at 90% 100%,rgba(0,0,0,.25),transparent 60%);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px dashed var(--yellow);outline-offset:3px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--chalk-dim)}

/* top rail */
header.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--wood);border-bottom:4px solid #4f361f;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.rail .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-size:1.35rem;color:#fff4dc;margin-right:auto;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1.5px solid rgba(255,244,220,.35);color:#fff4dc;border-radius:999px;padding:5px 12px;font-size:.92rem}
.tab[aria-selected="true"]{background:#fff4dc;color:#3b2716;border-color:#fff4dc;font-weight:700}

/* hero */
.hero{padding-block:36px 20px;display:grid;gap:14px}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem)}
.hero p{max-width:62ch;margin:0;color:var(--chalk-dim)}
.note{border:1.5px dashed var(--yellow);border-radius:10px;padding:12px 16px;color:var(--yellow);max-width:76ch}
.note b{color:var(--chalk)}

/* topic grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:18px}
.topic{position:relative;background:var(--board-2);border:1px solid var(--line);border-radius:12px}
.topic:hover{border-color:var(--yellow)}
.topic.known{border-color:var(--good);background:var(--board-3)}
.topic .open{all:unset;cursor:pointer;display:grid;gap:6px;padding:14px 52px 14px 14px;width:100%;box-sizing:border-box;border-radius:12px}
.topic .open:focus-visible{outline:2px dashed var(--yellow);outline-offset:-4px}
.check{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:2px solid var(--chalk-dim);background:transparent;color:var(--board);font-weight:700;font-size:1.05rem;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.knowbtn[aria-pressed="true"]{background:var(--good);color:var(--board);border-color:var(--good)}
.clockbox{display:flex;align-items:center;gap:6px;background:#3b2716;color:#fff4dc;border-radius:999px;padding:4px 6px 4px 12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem}
.clockbox[hidden]{display:none}
.clockbox .t{font-size:1.05rem;min-width:4.2ch;text-align:right}
.clockbox button{background:rgba(255,244,220,.15);border:0;color:#fff4dc;border-radius:999px;padding:3px 9px;font-size:.8rem}
.topic .num{font-family:var(--f-mono);font-size:.78rem;color:var(--chalk-dim);letter-spacing:.06em}
.topic h3{font-size:1.25rem}
.topic .tl{font-size:.85rem;color:var(--chalk-dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--chalk-dim)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--yellow);color:var(--yellow)}
.section-h{font-size:1.7rem;margin-top:28px}
.mix{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.mix div{border:1.5px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--chalk-dim);font-size:.95rem}
.mix b{color:var(--yellow);display:block}

/* slides */
.stage{margin-top:24px;background:var(--board-2);border:10px solid var(--wood);border-radius:6px;box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);padding:clamp(18px,4vw,40px);min-height:380px;display:grid;grid-template-rows:auto 1fr auto;gap:16px}
.stage .eyebrow{font-family:var(--f-mono);font-size:.8rem;color:var(--yellow);letter-spacing:.08em;text-transform:uppercase}
.stage h2{font-size:clamp(1.7rem,4.5vw,2.6rem)}
.stage ul{margin:0;padding-left:1.2em;display:grid;gap:10px;font-size:1.08rem;max-width:68ch}
.stage li::marker{color:var(--yellow)}
.stage dl{margin:0;display:grid;gap:10px;max-width:72ch}
.stage dt{color:var(--yellow);font-weight:700}
.stage dd{margin:0 0 0 1em}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--chalk);color:var(--board);border:0;border-radius:8px;padding:9px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.btn.y{background:var(--yellow);color:#2b2410}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--yellow)}
.btn.reading{background:var(--yellow);color:#2b2410;border-color:var(--yellow)}
.tts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin-top:14px;color:var(--chalk-dim);font-size:.92rem}
.tts select{font:inherit;background:var(--board-2);color:var(--chalk);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:220px}
.tts label{display:flex;gap:6px;align-items:center}
.topic-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.topic-pick button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.85rem;color:var(--chalk-dim)}
.topic-pick button[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}

/* flashcards */
.card-area{display:grid;place-items:center;margin-top:24px;gap:16px}
.flash{width:min(560px,100%);aspect-ratio:3/2;max-width:100%;perspective:1200px;background:none;border:0;padding:0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:grid;place-items:center;padding:24px;text-align:center;font-size:1.2rem;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.face.front{background:#f6f1df;color:#23312b;font-family:var(--f-display);font-size:clamp(1.4rem,4.5vw,2rem)}
.face.back{background:var(--board-3);border:1px solid var(--yellow);transform:rotateY(180deg)}
.face small{position:absolute;top:10px;left:14px;font-family:var(--f-mono);font-size:.72rem;opacity:.6}

/* quiz */
.qbox{margin-top:24px;background:var(--board-2);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,4vw,28px);display:grid;gap:14px}
.qbox h2{font-family:var(--f-body);font-size:1.3rem;font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--board);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.opt:hover:not(:disabled){border-color:var(--chalk-dim)}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.score{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--f-mono)}
.score b{color:var(--yellow);font-size:1.3rem}
.why{color:var(--chalk-dim)}

/* practice test (paper) */
.paper{color-scheme:light;margin-top:24px;background:#f6f1df;color:#23312b;border-radius:6px;padding:clamp(18px,4vw,40px);box-shadow:0 10px 30px rgba(0,0,0,.4);display:grid;gap:18px}
.paper h2{font-family:var(--f-display);color:#23312b}
.mcq{border:0;margin:0;padding:0 0 14px;border-bottom:1px solid #d9d2bc;display:grid;gap:8px;min-width:0}
.mcq legend{font-weight:700;padding:0;margin-bottom:8px}
.mcq .src{font-family:var(--f-mono);font-size:.72rem;color:#7a8580;font-weight:400;margin-left:6px}
.mopts{display:grid;gap:6px}
.mopts label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:6px;border:1.5px solid #d9d2bc;background:rgba(255,255,255,.6);cursor:pointer}
.mopts input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:3px 0 0;border:2px solid #7a8580;border-radius:50%;background:#fff;cursor:pointer}
.mopts input:checked{border-color:#f2d675;background:radial-gradient(circle,#f2d675 0 42%,#23312b 48%)}
.mopts label.sel{background:#23312b;color:#f6f1df;border-color:#23312b;font-weight:700;box-shadow:0 0 0 3px rgba(35,49,43,.25)}
.mopts label.sel::after{content:"✓ Selected";margin-left:auto;align-self:center;white-space:nowrap;font-family:var(--f-mono);font-size:.75rem;color:#f2d675}
.paper.graded .mopts label.sel::after{content:"Your answer";color:inherit}
.mopts label.is-right{background:#d6f0d9;border-color:#1d7a3a;color:#23312b;box-shadow:none}
.mopts label.is-wrong{background:#f8d7d5;border-color:#a2312b;color:#23312b;box-shadow:none}
.mcq.answered{border-left:4px solid #23312b;padding-left:12px}
.qnav{display:flex;flex-wrap:wrap;gap:5px}
.qnav button{width:32px;height:32px;padding:0;border-radius:6px;border:1.5px solid #b9b19a;background:rgba(255,255,255,.6);color:#23312b;font-family:var(--f-mono);font-size:.8rem}
.qnav button.done{background:#23312b;color:#f6f1df;border-color:#23312b}
.qnav button.ok{background:#1d7a3a;color:#fff;border-color:#1d7a3a}
.qnav button.no{background:#a2312b;color:#fff;border-color:#a2312b}
.qnav button.un{box-shadow:inset 0 0 0 3px #f2d675}
.qnav.rt button.un{background:#f2d675;color:#2b2410;border-color:#f2d675;box-shadow:none}
.qnav button:disabled{cursor:default;opacity:1}
.flag{margin-left:10px;font:700 .75rem var(--f-mono);border:1.5px solid #b9b19a;background:transparent;color:#55625b;border-radius:999px;padding:1px 9px;vertical-align:middle}
.flag[aria-pressed="true"]{background:#f2d675;border-color:#c9a93a;color:#2b2410}
.mcq .expl{font-size:.92rem;color:#38453f}
.mcq .expl b{color:#a2312b}
.grade{font-family:var(--f-display);font-size:2.6rem;color:#a2312b;transform:rotate(-5deg);display:inline-block}
.breakdown{display:flex;flex-wrap:wrap;gap:6px}
.breakdown span{font-size:.82rem;border-radius:999px;padding:2px 10px;border:1.5px solid #d9d2bc;background:#fff}
.breakdown span.lo{border-color:#a2312b;color:#a2312b}
.breakdown span.hi{border-color:#1d7a3a;color:#1d7a3a}
.warn-line{color:#a2312b;font-weight:700}
.timer{font-family:var(--f-mono);color:var(--yellow)}
.sticky-count{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));justify-self:end;background:#23312b;color:#f6f1df;border-radius:999px;padding:6px 14px;font-family:var(--f-mono);font-size:.85rem;box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* president lineup */
.lineup{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;max-width:640px;position:relative}
.pcard{position:relative;display:flex;align-items:center;gap:14px;background:#f6f1df;color:#23312b;border-radius:10px;padding:12px 14px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:background .3s}
.pcard.drag{cursor:grabbing;outline:3px dashed var(--yellow);z-index:2;box-shadow:0 10px 24px rgba(0,0,0,.45);transition:none}
.pcard .slot{font-family:var(--f-display);font-size:1.9rem;min-width:1.4ch;color:#a2312b}
.pcard .who{min-width:0;display:grid;gap:2px}
.pcard b{font-size:1.15rem}
.pcard small{color:#55625b;font-size:.88rem}
.pcard .yrs{font-family:var(--f-mono);color:#1d7a3a}
.pcard .arrows{margin-left:auto;display:flex;flex-direction:column;gap:4px}
.pcard .arrows button{background:#e6dfc8;border:0;border-radius:6px;width:32px;height:26px;color:#23312b;font-size:.85rem;padding:0}
.pcard .arrows button:disabled{opacity:.3}
.lineup.solved .pcard{background:#d6f0d9}
.lstat{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lstat b{color:var(--yellow)}
.win{font-family:var(--f-display);font-size:2rem;color:var(--yellow);margin:14px 0 0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}
@media (max-width:560px){.brand{width:100%}.dots{margin-left:0;width:100%}}
</style>

</head><body>
<header class="rail"><div class="wrap">
  <div class="brand">Room 1787 · Unit 3</div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="clockbox" id="clockbox" hidden aria-live="off">
    <span id="clabel">Lesson 1</span><span class="t" id="ctime">0:00</span>
    <button id="cpause">Pause</button><button id="creset">Reset</button>
  </div>
</div></header>

<main class="wrap" id="app"></main>

<script>
/* Each lesson: slides (h, p bullets, optional tip), terms [term, definition] for the recap slide and flashcards,
   quiz [question, [correct, wrong, wrong, wrong], explanation]. Answer order is shuffled at runtime. */
const T = [
{id:"aoc",title:"Articles of Confederation & Shays' Rebellion",when:"1781–1787",
 slides:[
  {h:"The Articles of Confederation",p:["The first plan of government for the United States, ratified in 1781.","Created a one-house Congress where each state got one vote.","There was no president to enforce laws and no national court system.","It was weak on purpose. Americans had just fought a king and feared a strong central government."]},
  {h:"Why the Articles failed",p:["Congress could not collect taxes. It could only ask the states for money.","Congress could not regulate trade between the states.","Each state printed its own money.","Passing a law took 9 of 13 states. Changing the Articles took all 13.","One success: the Northwest Ordinance of 1787 set up how new territories become states."]},
  {h:"Shays' Rebellion",p:["In 1786 and 1787, Daniel Shays led Massachusetts farmers who were deep in debt and losing their farms.","They shut down courts and marched on a weapons arsenal in Springfield.","The national government had no army and could not stop them. The state militia did.","It scared leaders and proved the Articles were too weak, so they called the Constitutional Convention in 1787."]}],
 terms:[["Articles of Confederation","First U.S. government (1781). Weak national government: Congress could not tax, and there was no president or national courts."],["Shays' Rebellion","1786–1787 revolt of indebted Massachusetts farmers. Proved the Articles were too weak and led to the Constitutional Convention."]],
 quiz:[["Under the Articles of Confederation, Congress could NOT…",["collect taxes","declare war","make treaties","borrow money"],"Congress could only ask the states for money."],
  ["Why did Americans make the Articles of Confederation weak on purpose?",["They feared a strong central government like the British king","They wanted the states to have no power","France asked them to","They planned to replace it right away"],"After the Revolution, people feared another king."],
  ["Who took part in Shays' Rebellion?",["Massachusetts farmers in debt","British soldiers","Enslaved people in Virginia","Merchants in New York"],"Farmers were losing their land because of debts and taxes."],
  ["What did Shays' Rebellion show?",["The national government was too weak to keep order","The states had too little power","The president had too much power","The army was too large"],"The national government could not raise an army to stop it."],
  ["Which event led most directly to the Constitutional Convention?",["Shays' Rebellion","The War of 1812","The Louisiana Purchase","The Election of 1800"],"It convinced leaders the Articles had to be fixed."],
  ["Under the Articles, how many votes did each state have in Congress?",["One","Two","It depended on population","None"],"Every state, big or small, got one vote."],
  ["What did it take to change (amend) the Articles of Confederation?",["All 13 states had to agree","9 of 13 states","A vote of the president","A majority of the people"],"Needing all 13 made changes almost impossible."],
  ["Which branch of government was MISSING under the Articles?",["An executive (president) and national courts","A legislature","A Congress","State governments"],"Only Congress existed at the national level."]]},

{id:"va",title:"Virginia's Founding Documents",when:"1776–1786",
 slides:[
  {h:"George Mason & the Virginia Declaration of Rights",p:["Written by George Mason in 1776.","Listed rights the government could not take away: freedom of the press, freedom of religion, and trial by jury.","Said government gets its power from the people.","It became a model for the Bill of Rights."]},
  {h:"The Virginia Statute for Religious Freedom",p:["Written by Thomas Jefferson. Passed in 1786 with James Madison's help.","Separated church and state in Virginia: no official state church.","Nobody could be forced to attend or pay for a church.","It became a model for freedom of religion in the First Amendment."]},
  {h:"George Mason at the Convention",p:["Mason was a delegate at the Constitutional Convention.","He refused to sign the Constitution because it had no bill of rights.","He became an Anti-Federalist."],tip:"Memory trick: Mason = rights (Declaration of Rights). Jefferson = religion (Statute for Religious Freedom)."}],
 terms:[["George Mason","Virginian who wrote the Virginia Declaration of Rights. Refused to sign the Constitution because it had no bill of rights."],["Virginia Declaration of Rights","1776 list of individual rights by George Mason. Model for the Bill of Rights."],["Virginia Statute for Religious Freedom","1786 law by Thomas Jefferson separating church and state. Model for the First Amendment."]],
 quiz:[["Who wrote the Virginia Declaration of Rights?",["George Mason","Thomas Jefferson","James Madison","George Washington"],"Mason = rights."],
  ["Who wrote the Virginia Statute for Religious Freedom?",["Thomas Jefferson","George Mason","John Adams","Patrick Henry"],"Jefferson = religion."],
  ["The Virginia Statute for Religious Freedom…",["separated church and state","created the Bill of Rights","ended slavery in Virginia","set up the Electoral College"],"No official state church; nobody forced to support one."],
  ["The Virginia Declaration of Rights was a model for…",["the Bill of Rights","the Articles of Confederation","the Monroe Doctrine","the Jay Treaty"],"Its list of rights shaped the first 10 amendments."],
  ["Why did George Mason refuse to sign the Constitution?",["It did not include a bill of rights","It gave states too much power","He wanted a king","He was not allowed to vote"],"He became an Anti-Federalist."],
  ["The Virginia Statute for Religious Freedom inspired which amendment?",["The First Amendment","The Second Amendment","The Tenth Amendment","The Twelfth Amendment"],"The First Amendment protects freedom of religion."],
  ["Which right was listed in the Virginia Declaration of Rights?",["Freedom of the press","The right to own a bank","The right to vote for senators","Freedom from taxes"],"It also protected religion and trial by jury."],
  ["Which Virginian helped pass Jefferson's Statute for Religious Freedom in 1786?",["James Madison","John Jay","Alexander Hamilton","Andrew Jackson"],"Madison got it through the Virginia legislature while Jefferson was in France."]]},

{id:"conv",title:"The Constitutional Convention",when:"1787",
 slides:[
  {h:"The Convention",p:["Delegates met in Philadelphia in the summer of 1787 to fix the Articles. They wrote a new Constitution instead.","George Washington presided over (ran) the Convention.","James Madison is called the Father of the Constitution. He wrote the Virginia Plan and took detailed notes."]},
  {h:"Virginia Plan vs. New Jersey Plan",p:["Virginia Plan (James Madison): three branches and a two-house Congress with representation based on population. Helped LARGE states.","New Jersey Plan (William Paterson): a one-house Congress where every state gets an equal vote. Helped SMALL states."],tip:"Memory trick: Virginia was a big state, so the Virginia Plan helped big states."},
  {h:"The Great Compromise",p:["Also called the Connecticut Compromise (Roger Sherman).","Created a two-house (bicameral) Congress.","House of Representatives: seats based on population. Big states happy.","Senate: two senators per state. Small states happy."]},
  {h:"The 3/5ths Compromise",p:["The North and South argued over whether enslaved people should count toward a state's population.","The deal: three out of every five enslaved people were counted for representation and taxes.","This gave Southern states more seats in the House.","Delegates also agreed Congress could not ban the slave trade until 1808."]}],
 terms:[["Virginia Plan","Madison's plan: three branches, two-house Congress based on population. Favored large states."],["New Jersey Plan","Paterson's plan: one-house Congress, equal votes per state. Favored small states."],["Great Compromise","Two-house Congress: House based on population, Senate equal with two per state."],["3/5ths Compromise","Three of every five enslaved people counted for representation and taxes. A North vs. South deal."],["James Madison","Father of the Constitution. Wrote the Virginia Plan and the Bill of Rights, and later was the 4th president."]],
 quiz:[["Which plan favored LARGE states?",["The Virginia Plan","The New Jersey Plan","The Great Compromise","The 3/5ths Compromise"],"Representation by population helped big states."],
  ["The New Jersey Plan called for…",["equal representation for every state","representation based on population","no Congress at all","a king"],"It protected small states."],
  ["The Great Compromise created…",["a House based on population and a Senate with equal representation","a one-house Congress","the Bill of Rights","the Electoral College only"],"It blended the Virginia and New Jersey Plans."],
  ["The 3/5ths Compromise settled a disagreement between…",["Northern and Southern states","large and small states","Federalists and Anti-Federalists","Britain and France"],"It was about counting enslaved people."],
  ["Under the 3/5ths Compromise, enslaved people were counted…",["as three-fifths of a person for representation and taxes","fully for representation","not at all","only for taxes"],"This gave the South more seats in the House."],
  ["Who is known as the Father of the Constitution?",["James Madison","George Washington","Thomas Jefferson","Alexander Hamilton"],"He wrote the Virginia Plan and took notes."],
  ["Who presided over the Constitutional Convention?",["George Washington","Benjamin Franklin","John Adams","James Monroe"],"People trusted him to run the meeting."],
  ["The Great Compromise is also called the…",["Connecticut Compromise","Missouri Compromise","Virginia Compromise","Federal Compromise"],"Roger Sherman of Connecticut proposed it."]]},

{id:"prin",title:"Principles of the Constitution",when:"1787",
 slides:[
  {h:"Separation of Powers",p:["The national government's power is split among three branches so no one branch gets too much power.","Legislative branch (Congress) makes the laws.","Executive branch (the President) carries out and enforces the laws.","Judicial branch (the courts) interprets the laws."]},
  {h:"Checks and Balances",p:["Each branch can limit, or check, the other two.","The President can veto a law Congress passes.","Congress can override a veto with a two-thirds vote, and can impeach the President.","The Senate approves treaties and the President's appointments, like judges.","The courts can declare laws unconstitutional."]},
  {h:"Federalism",p:["Power is divided between the national government and the state governments.","Delegated powers belong to the national government: printing money, declaring war, making treaties.","Reserved powers belong to the states: running schools, holding elections, giving licenses.","Concurrent powers are shared by both: collecting taxes, making courts, borrowing money."],tip:"Watch out: federalism (sharing power with states) is different from the Federalists (people who supported the Constitution)."}],
 terms:[["Separation of Powers","Government power split among three branches: legislative makes laws, executive enforces laws, judicial interprets laws."],["Checks and Balances","Each branch can limit the others, such as a presidential veto or the courts declaring a law unconstitutional."],["Federalism","Power divided between the national government and the state governments."]],
 quiz:[["Dividing power between the national government and the states is called…",["federalism","separation of powers","checks and balances","judicial review"],"Federal + state = federalism."],
  ["Dividing power among three branches of government is called…",["separation of powers","federalism","impressment","nullification"],"Legislative, executive, and judicial."],
  ["A president vetoing a bill is an example of…",["checks and balances","federalism","impressment","the Great Compromise"],"The executive is checking the legislature."],
  ["Which branch interprets the laws?",["Judicial","Legislative","Executive","State"],"The courts decide what laws mean."],
  ["Which branch makes the laws?",["Legislative (Congress)","Executive (President)","Judicial (courts)","The states"],"Congress writes and passes laws."],
  ["Which power is shared by BOTH the national and state governments?",["Collecting taxes","Declaring war","Printing money","Making treaties"],"Shared powers are called concurrent powers."],
  ["Which power is RESERVED for the states?",["Running public schools","Declaring war","Printing money","Making treaties with other countries"],"Schools, elections, and licenses belong to the states."],
  ["The main goal of separation of powers and checks and balances is to…",["keep any one branch from becoming too powerful","make the president stronger","give all power to the states","speed up passing laws"],"Americans feared tyranny after dealing with the king."]]},

{id:"rat",title:"Federalists, Anti-Federalists & the Bill of Rights",when:"1787–1791",
 slides:[
  {h:"Federalists",p:["Supported the new Constitution and a strong national government.","Leaders: Alexander Hamilton, James Madison, and John Jay.","They wrote the Federalist Papers, 85 essays explaining why states should ratify the Constitution."]},
  {h:"Anti-Federalists",p:["Opposed the Constitution as written.","Feared a strong national government would take away people's rights and the states' power.","Demanded a bill of rights.","Leaders: Patrick Henry and George Mason."]},
  {h:"Alexander Hamilton & John Jay",p:["Alexander Hamilton of New York wrote most of the Federalist Papers. He became the first Secretary of the Treasury and created the national bank.","John Jay wrote some of the Federalist Papers, became the first Chief Justice of the Supreme Court, and negotiated the Jay Treaty with Britain in 1794."]},
  {h:"The Bill of Rights",p:["The first 10 amendments to the Constitution, added in 1791.","Protects individual rights: speech, religion, press, assembly, petition, bearing arms, fair trials, and protection from unfair searches.","Federalists promised it to win over Anti-Federalists so the Constitution would be ratified.","James Madison wrote it, using George Mason's Virginia Declaration of Rights as a model."]}],
 terms:[["Federalists","Supported the Constitution and a strong national government. Hamilton, Madison, Jay; wrote the Federalist Papers."],["Anti-Federalists","Opposed the Constitution; feared losing rights and state power; demanded a bill of rights. Patrick Henry, George Mason."],["Alexander Hamilton","Federalist who wrote most of the Federalist Papers; first Secretary of the Treasury; created the national bank."],["John Jay","Federalist Papers author, first Chief Justice of the Supreme Court, negotiated the Jay Treaty."],["Bill of Rights","First 10 amendments (1791) protecting individual rights. Added to win Anti-Federalist support."]],
 quiz:[["The Anti-Federalists insisted that the Constitution needed…",["a bill of rights","a king","a stronger president","a national bank"],"They feared the government would take away rights."],
  ["Which person was an Anti-Federalist?",["Patrick Henry","Alexander Hamilton","John Jay","James Madison"],"Henry opposed the Constitution."],
  ["The Federalist Papers were written to…",["convince people to ratify the Constitution","declare independence","end the War of 1812","create the Articles of Confederation"],"85 essays by Hamilton, Madison, and Jay."],
  ["The Bill of Rights is…",["the first 10 amendments to the Constitution","the Articles of Confederation","a treaty with Britain","a Supreme Court case"],"It was added in 1791."],
  ["Who was the first Chief Justice of the Supreme Court?",["John Jay","John Marshall","John Adams","James Monroe"],"Jay also negotiated the Jay Treaty."],
  ["Who was the first Secretary of the Treasury?",["Alexander Hamilton","Thomas Jefferson","John Jay","Henry Clay"],"Hamilton created the national bank."],
  ["Federalists wanted…",["a strong national government","the states to keep most power","no Constitution","to rejoin Britain"],"They supported the Constitution."],
  ["Why was the Bill of Rights added to the Constitution?",["To win the support of Anti-Federalists","To end the War of 1812","To buy Louisiana","To create political parties"],"It was the deal that got the Constitution ratified."]]},

{id:"gwa",title:"Washington, Adams & the First Parties",when:"1789–1801",
 slides:[
  {h:"George Washington",p:["First President, from 1789 to 1797.","Set precedents (examples) for future presidents: he created the cabinet and served only two terms.","Ended the Whiskey Rebellion with troops, showing the new government could enforce its laws.","His Farewell Address warned against political parties and permanent alliances with foreign countries."]},
  {h:"The first political parties",p:["Hamilton and Jefferson disagreed so much that two parties formed.","Federalist Party (Hamilton, John Adams): strong national government, national bank, business and trade, friendly with Britain.","Democratic-Republican Party (Jefferson, Madison): states' rights, farmers, strict reading of the Constitution, friendly with France."]},
  {h:"Proclamation of Neutrality & the Jay Treaty",p:["Proclamation of Neutrality (1793): Washington declared the U.S. would not take sides in the war between Britain and France.","Jay Treaty (1794): John Jay made a deal with Britain. The British agreed to leave their forts in the Northwest Territory.","The Jay Treaty kept the U.S. out of war, but many Americans hated it because it did not stop Britain from seizing American ships and sailors."]},
  {h:"John Adams",p:["Second President, from 1797 to 1801. A Federalist.","XYZ Affair: French officials demanded a bribe from American diplomats, leading to an undeclared naval war with France.","Alien and Sedition Acts (1798) limited criticism of the government.","Lost the Election of 1800 to Thomas Jefferson."]}],
 terms:[["George Washington","First President (1789–1797). Created the cabinet, served two terms, warned against parties and foreign alliances."],["Democratic-Republican Party","Jefferson and Madison's party: states' rights, farmers, strict reading of the Constitution, pro-France."],["Proclamation of Neutrality","1793: Washington kept the U.S. out of the war between Britain and France."],["Jay Treaty","1794 treaty with Britain by John Jay. Britain left western forts and war was avoided, but it was unpopular."],["John Adams","Second President (1797–1801), a Federalist. XYZ Affair; Alien and Sedition Acts; lost to Jefferson in 1800."]],
 quiz:[["In his Farewell Address, Washington warned against…",["political parties and permanent foreign alliances","trading with China","adding new states","the Bill of Rights"],"He worried parties would divide the nation."],
  ["The Proclamation of Neutrality said the U.S. would…",["not take sides in the war between Britain and France","join France against Britain","declare war on Spain","stop trading with all nations"],"The young nation was too weak for war."],
  ["Under the Jay Treaty, Britain agreed to…",["leave its forts in the Northwest Territory","give Canada to the U.S.","stop the slave trade","sell Louisiana"],"It avoided war but was unpopular."],
  ["The Democratic-Republican Party was led by…",["Thomas Jefferson and James Madison","Alexander Hamilton and John Adams","Henry Clay and Daniel Webster","George Washington"],"Jefferson's party favored states' rights and farmers."],
  ["Who was the second President of the United States?",["John Adams","Thomas Jefferson","John Quincy Adams","James Madison"],"John Adams, 1797 to 1801."],
  ["Which precedent did George Washington set?",["Serving only two terms","Buying Louisiana","Writing the Monroe Doctrine","Vetoing the Bill of Rights"],"Presidents followed it until the 22nd Amendment made it law."],
  ["The Democratic-Republicans generally supported…",["states' rights and farmers","a strong national bank","close ties with Britain","a loose reading of the Constitution"],"That was the Federalist position."],
  ["The Jay Treaty was unpopular mainly because it…",["did not stop Britain from seizing American ships and sailors","started a war","gave away Florida","raised taxes on farmers"],"Impressment continued."]]},

{id:"jeff",title:"Jefferson, Louisiana & Lewis and Clark",when:"1800–1809",
 slides:[
  {h:"The Election of 1800",p:["Thomas Jefferson (Democratic-Republican) defeated President John Adams (Federalist).","Jefferson and Aaron Burr tied in electoral votes, so the House of Representatives chose Jefferson.","It was the first peaceful transfer of power from one political party to another, sometimes called the Revolution of 1800.","The tie led to the 12th Amendment: electors vote separately for President and Vice President."]},
  {h:"Thomas Jefferson",p:["Third President, from 1801 to 1809.","Wrote the Declaration of Independence and the Virginia Statute for Religious Freedom.","Believed in limited government, farmers, and a strict reading of the Constitution."]},
  {h:"The Louisiana Purchase",p:["In 1803 the U.S. bought the Louisiana Territory from France (Napoleon) for 15 million dollars.","It doubled the size of the United States.","It gave the U.S. control of the Mississippi River and the port of New Orleans.","Jefferson worried the Constitution did not allow it, but he bought it anyway."]},
  {h:"Lewis & Clark and Sacagawea",p:["Meriwether Lewis and William Clark led the Corps of Discovery from 1804 to 1806.","Jefferson sent them to explore the Louisiana Territory, map it, study plants and animals, meet Native nations, and find a route to the Pacific Ocean.","Sacagawea, a Shoshone woman, served as an interpreter and guide. She helped them get horses and showed Native nations the group was peaceful."]}],
 terms:[["Election of 1800","Jefferson beat Adams. First peaceful transfer of power between parties. A Jefferson–Burr tie led to the 12th Amendment."],["Thomas Jefferson","Third President (1801–1809), Democratic-Republican. Louisiana Purchase; wrote the Declaration of Independence."],["Louisiana Purchase","1803 purchase from France for 15 million dollars. Doubled the size of the U.S."],["Lewis & Clark","Explored the Louisiana Territory to the Pacific Ocean, 1804–1806."],["Sacagawea","Shoshone woman who served as interpreter and guide for Lewis and Clark."]],
 quiz:[["Why is the Election of 1800 important?",["It was the first peaceful transfer of power between political parties","It was the first election with women voting","It started the War of 1812","It ended the Articles of Confederation"],"Power passed from Federalists to Democratic-Republicans without violence."],
  ["The United States bought the Louisiana Territory from…",["France","Britain","Spain","Mexico"],"Napoleon sold it in 1803."],
  ["The Louisiana Purchase…",["doubled the size of the United States","gave the U.S. Florida","ended the War of 1812","created the state of Maine"],"About 828,000 square miles."],
  ["Which president made the Louisiana Purchase?",["Thomas Jefferson","James Madison","John Adams","James Monroe"],"In 1803."],
  ["Who served as interpreter and guide for Lewis and Clark?",["Sacagawea","Tecumseh","Pocahontas","Sequoyah"],"She was Shoshone."],
  ["What was the main goal of the Lewis and Clark expedition?",["To explore the Louisiana Territory and find a route to the Pacific","To fight the British in Canada","To find gold in California","To buy Florida from Spain"],"Jefferson wanted to know what he had bought."],
  ["In the Election of 1800, who decided the winner after the electoral tie?",["The House of Representatives","The Supreme Court","The Senate","George Washington"],"The House chose Jefferson over Aaron Burr."],
  ["Which important port did the Louisiana Purchase give the U.S.?",["New Orleans","Boston","Baltimore","San Francisco"],"It controls the mouth of the Mississippi River."]]},

{id:"w1812",title:"The War of 1812",when:"1812–1815",
 slides:[
  {h:"Causes of the War of 1812",p:["Impressment: Britain kidnapped American sailors and forced them to serve in the British Royal Navy.","Britain seized American ships and blocked trade with France.","Britain gave guns to Native Americans on the frontier, like Tecumseh's followers.","The War Hawks in Congress pushed for war. President James Madison asked Congress to declare war in June 1812."],tip:"Memory trick: I.T.N.W. Impressment, Trade, Natives, War Hawks."},
  {h:"The War Hawks",p:["Young members of Congress from the South and West, like Henry Clay and John C. Calhoun.","They wanted war with Britain to defend American honor, stop British support for Native attacks, and take over Canada."]},
  {h:"Battles, part 1",p:["Detroit (1812): an American invasion of Canada failed and Detroit surrendered.","USS Constitution, nicknamed Old Ironsides, won famous sea battles.","Battle of Lake Erie (1813): Oliver Hazard Perry won control of Lake Erie. He reported, We have met the enemy and they are ours.","Battle of the Thames (1813): William Henry Harrison won in Canada, and the Shawnee leader Tecumseh was killed."]},
  {h:"Battles, part 2",p:["Battle of Horseshoe Bend (1814): Andrew Jackson defeated the Creek nation.","Burning of Washington (August 1814): the British burned the White House and Capitol. Dolley Madison saved George Washington's portrait.","Fort McHenry (September 1814): the fort in Baltimore held, and Francis Scott Key wrote The Star-Spangled Banner.","Battle of New Orleans (January 1815): Andrew Jackson won a huge victory, but the peace treaty had already been signed."]},
  {h:"The Treaty of Ghent & results",p:["The Treaty of Ghent (December 1814) ended the war. No land changed hands, and impressment was not even mentioned.","Americans felt a surge of national pride, called nationalism.","American factories grew because British goods were cut off.","The Federalist Party collapsed because it opposed the war.","Native American resistance was weakened, and Andrew Jackson became a national hero."]}],
 terms:[["Impressment","Britain forcing (kidnapping) American sailors into the British Royal Navy. A major cause of the War of 1812."],["War Hawks","Members of Congress like Henry Clay and John C. Calhoun who pushed for war with Britain in 1812."],["War of 1812","War between the U.S. and Britain (1812–1815) over impressment, trade, and British support for Native Americans."],["Battles of the War of 1812","Lake Erie, the Thames, Horseshoe Bend, Washington burned, Fort McHenry, and New Orleans."],["Treaty of Ghent","December 1814 treaty that ended the War of 1812. No land changed hands."]],
 quiz:[["Impressment was…",["Britain forcing American sailors into the British navy","the president rejecting a law","buying land from France","a tax on whiskey"],"A major cause of the War of 1812."],
  ["The War Hawks were…",["members of Congress who wanted war with Britain","British generals","Native American leaders","Federalists who opposed war"],"Henry Clay and John C. Calhoun."],
  ["The Treaty of Ghent…",["ended the War of 1812 with no land changing hands","gave Canada to the U.S.","ended the American Revolution","bought Florida from Spain"],"Things went back to how they were before."],
  ["Which battle was fought AFTER the peace treaty was signed?",["The Battle of New Orleans","The Battle of Lake Erie","The Battle of the Thames","The Battle of Horseshoe Bend"],"News of the treaty had not reached New Orleans yet."],
  ["Who led the Americans at the Battle of New Orleans?",["Andrew Jackson","William Henry Harrison","Oliver Hazard Perry","James Madison"],"It made Jackson a national hero."],
  ["The Star-Spangled Banner was written after the attack on…",["Fort McHenry","Fort Detroit","New Orleans","Lake Erie"],"Francis Scott Key watched the fort hold in Baltimore."],
  ["Which was a major cause of the War of 1812?",["British impressment of American sailors","The XYZ Affair","Shays' Rebellion","The Missouri Compromise"],"Plus trade problems, arming Natives, and the War Hawks."],
  ["Which was a result of the War of 1812?",["A rise in American nationalism","The U.S. gained Canada","The Federalist Party grew stronger","Britain won back its colonies"],"Americans felt proud they stood up to Britain."]]},

{id:"court",title:"The Marshall Court Cases",when:"1803–1824",
 slides:[
  {h:"John Marshall's Supreme Court",p:["John Marshall was Chief Justice from 1801 to 1835.","His decisions made the Supreme Court and the national government stronger."],tip:"Memory trick: Marbury = Mighty court (judicial review). McCulloch = Money (the bank) and Maryland. Gibbons = Goods and boats moving between states."},
  {h:"Marbury v. Madison (1803)",p:["William Marbury was appointed a judge by John Adams at the last minute, but Secretary of State James Madison never delivered his paperwork.","Marbury sued. The Court ruled that the law he used to sue was unconstitutional.","This set up judicial review: the Supreme Court can declare a law unconstitutional.","It made the judicial branch an equal partner with the other two branches."]},
  {h:"McCulloch v. Maryland (1819)",p:["Maryland tried to tax the Second Bank of the United States, a national bank.","The Court ruled Congress had the power to create the bank, using implied powers from the Necessary and Proper Clause.","States cannot tax the national government. As Marshall wrote, the power to tax involves the power to destroy.","Result: national law is supreme over state law."]},
  {h:"Gibbons v. Ogden (1824)",p:["A fight between two steamboat operators over who could run boats between New York and New Jersey.","The Court ruled that only Congress can regulate interstate commerce, meaning trade between states.","It made the national government stronger over business and trade."]}],
 terms:[["Marbury v. Madison","1803 case that established judicial review: the Supreme Court can declare laws unconstitutional."],["McCulloch v. Maryland","1819 case: Congress could create a national bank, and states cannot tax the federal government. Federal law is supreme."],["Gibbons v. Ogden","1824 case: only Congress can regulate interstate commerce (trade between states)."]],
 quiz:[["Which case established judicial review?",["Marbury v. Madison","McCulloch v. Maryland","Gibbons v. Ogden","Dred Scott v. Sandford"],"The Court can declare laws unconstitutional."],
  ["Judicial review is the power of the courts to…",["declare laws unconstitutional","veto bills","declare war","tax the states"],"Established in Marbury v. Madison."],
  ["In McCulloch v. Maryland, the Court ruled that…",["states cannot tax the national bank","states can tax the federal government","the national bank was unconstitutional","Maryland could leave the Union"],"Federal law is supreme over state law."],
  ["Gibbons v. Ogden was about…",["regulating interstate commerce (steamboats)","a national bank","a judge's appointment","freedom of religion"],"Only Congress regulates trade between states."],
  ["Who was Chief Justice during these three cases?",["John Marshall","John Jay","John Adams","John Quincy Adams"],"Marshall served from 1801 to 1835."],
  ["Which case dealt with the Second Bank of the United States?",["McCulloch v. Maryland","Marbury v. Madison","Gibbons v. Ogden","Worcester v. Georgia"],"Maryland tried to tax the bank."],
  ["Overall, the Marshall Court decisions…",["strengthened the national government","made the states more powerful than Congress","weakened the Supreme Court","ended political parties"],"Each case boosted federal power."],
  ["Which case said only Congress can regulate trade between states?",["Gibbons v. Ogden","McCulloch v. Maryland","Marbury v. Madison","Plessy v. Ferguson"],"Gibbons = goods and boats between states."]]},

{id:"monroe",title:"Monroe, John Quincy Adams & Jackson",when:"1817–1830s",
 slides:[
  {h:"James Monroe & the Era of Good Feelings",p:["James Monroe was the fifth President, from 1817 to 1825.","His time in office is called the Era of Good Feelings.","After the War of 1812, Americans felt united and proud, and the Federalist Party faded away, leaving basically one party.","But arguments between the North and South over slavery were growing."]},
  {h:"The Missouri Compromise (1820)",p:["Missouri wanted to join as a slave state, which would upset the even balance of 11 free and 11 slave states in the Senate.","Henry Clay helped make a deal: Missouri joined as a slave state and Maine as a free state.","Slavery was banned in the rest of the Louisiana Territory north of the 36°30′ line."]},
  {h:"The Monroe Doctrine (1823)",p:["Warned European nations not to start new colonies or interfere in the Western Hemisphere (North and South America).","In return, the U.S. would stay out of European affairs.","It was meant to protect newly independent Latin American countries.","Written mostly by Secretary of State John Quincy Adams."],tip:"Memory trick: I stay on my side, you stay on yours."},
  {h:"John Quincy Adams",p:["Son of John Adams.","As Secretary of State under Monroe, he wrote most of the Monroe Doctrine and got Florida from Spain.","Sixth President, from 1825 to 1829.","He won the Election of 1824 in the House of Representatives even though Andrew Jackson had more popular votes. Jackson called it a corrupt bargain because Henry Clay then became Secretary of State."]},
  {h:"Andrew Jackson & the Whig Party",p:["Andrew Jackson, nicknamed Old Hickory, was the hero of the Battle of New Orleans.","He was the seventh President, from 1829 to 1837, and was seen as a champion of the common man. His supporters became the Democratic Party.","The Whig Party formed in the 1830s to oppose Jackson, whom they called King Andrew.","Whig leaders like Henry Clay and Daniel Webster wanted a national bank, tariffs, and roads and canals."]}],
 terms:[["James Monroe","Fifth President (1817–1825). Era of Good Feelings, Missouri Compromise, Monroe Doctrine."],["Era of Good Feelings","Monroe's presidency after the War of 1812: national pride and basically one political party."],["Missouri Compromise","1820: Missouri a slave state, Maine a free state, no slavery north of 36°30′."],["Monroe Doctrine","1823: Europe must stay out of the Western Hemisphere; the U.S. stays out of Europe."],["John Quincy Adams","Son of John Adams. Wrote the Monroe Doctrine as Secretary of State; sixth President (1825–1829)."],["Andrew Jackson","Hero of New Orleans; seventh President (1829–1837); champion of the common man."],["Whig Party","Party formed in the 1830s to oppose Andrew Jackson. Henry Clay, Daniel Webster."]],
 quiz:[["The Era of Good Feelings describes the presidency of…",["James Monroe","Andrew Jackson","John Adams","Thomas Jefferson"],"National pride and one main party."],
  ["The Monroe Doctrine warned European nations to…",["stay out of the Western Hemisphere","leave Canada","stop the slave trade","pay their war debts"],"In return, the U.S. stayed out of Europe."],
  ["Who mainly wrote the Monroe Doctrine?",["John Quincy Adams","James Monroe","Thomas Jefferson","Henry Clay"],"He was Monroe's Secretary of State."],
  ["Under the Missouri Compromise, Maine entered the Union as…",["a free state","a slave state","a territory","part of Canada"],"Missouri was slave, Maine was free."],
  ["The Missouri Compromise was meant to…",["keep the balance between free and slave states","end slavery everywhere","stop the War of 1812","create the Bill of Rights"],"It kept the Senate even."],
  ["The Whig Party formed to oppose…",["Andrew Jackson","George Washington","Thomas Jefferson","the Monroe Doctrine"],"They called him King Andrew."],
  ["John Quincy Adams was the son of…",["John Adams","Samuel Adams","James Monroe","George Washington"],"Father was the 2nd President; son was the 6th."],
  ["Andrew Jackson became a national hero because of…",["the Battle of New Orleans","the Louisiana Purchase","the Monroe Doctrine","the XYZ Affair"],"His 1815 victory over the British."]]}
];

/* ---------- read aloud ---------- */
/* Andrew and Ava are pre-recorded neural voices (audio/<voice>/<lesson>-<slide>.mp3); "computer" falls back to the browser's own voice.
   One shared player plus a speak id: starting anything stops everything else, so only the current slide is ever heard. */
const VOICES=[["andrew","Andrew (natural, male)"],["ava","Ava (natural, female)"],["computer","Computer voice (offline)"]];
const tts={on:true,speaking:false,browser:"speechSynthesis" in window};
const player=new Audio(); let speakId=0;
S.tts=Object.assign({voice:"andrew",rate:1,auto:false},S.tts);
if(!VOICES.some(v=>v[0]===S.tts.voice)) S.tts.voice="andrew";
function voiceOpts(){return VOICES.filter(v=>v[0]!=="computer"||tts.browser).map(([k,l])=>`<option value="${k}" ${k===S.tts.voice?"selected":""}>${l}</option>`).join("")}
function setReadBtn(){const b=$("#read");if(b){b.textContent=tts.speaking?"■ Stop reading":"🔊 Read slide";b.classList.toggle("reading",tts.speaking)}}
function stopSpeak(){speakId++;tts.speaking=false;player.onended=player.onerror=null;player.pause();if(tts.browser)try{speechSynthesis.cancel()}catch(e){}setReadBtn()}
function browserSpeak(text,done){
  if(!tts.browser){done();return}
  const u=new SpeechSynthesisUtterance(text);
  const best=speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)&&/natural|premium|enhanced|google us/i.test(v.name)); if(best)u.voice=best;
  u.rate=S.tts.rate; u.onend=u.onerror=done;
  tts.speaking=true; setReadBtn(); speechSynthesis.speak(u);
}
function speak(text,file){
  stopSpeak(); const id=speakId;
  const done=()=>{if(id!==speakId)return;tts.speaking=false;setReadBtn()};
  if(S.tts.voice==="computer"||!file){browserSpeak(text,done);return}
  player.src=`audio/${S.tts.voice}/${file}.mp3`;
  player.defaultPlaybackRate=player.playbackRate=S.tts.rate;
  player.onended=done;
  player.onerror=()=>{if(id===speakId)browserSpeak(text,done)};
  tts.speaking=true; setReadBtn();
  player.play().catch(done);
}

/* ---------- per-lesson timer (runs only in Lessons) ---------- */
const clock={topic:null,start:null,paused:false};
const fmt=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
function clockElapsed(id){return (S.times[id]||0)+(clock.topic===id&&clock.start?Date.now()-clock.start:0)}
function clockStop(){if(clock.topic&&clock.start){S.times[clock.topic]=(S.times[clock.topic]||0)+Date.now()-clock.start;clock.start=null;save()}}
function clockSet(id){if(clock.topic!==id){clockStop();clock.topic=id}if(!clock.paused&&!clock.start)clock.start=Date.now();clockDraw()}
function clockDraw(){
  const box=$("#clockbox"); box.hidden=room!=="lessons"||!clock.topic;
  if(box.hidden)return;
  $("#clabel").textContent=`Lesson ${T.findIndex(t=>t.id===clock.topic)+1}`;
  $("#ctime").textContent=fmt(clockElapsed(clock.topic));
  $("#cpause").textContent=clock.paused?"Resume":"Pause";
}
$("#cpause").onclick=()=>{clock.paused=!clock.paused;if(clock.paused)clockStop();else clock.start=Date.now();clockDraw()};
$("#creset").onclick=()=>{S.times[clock.topic]=0;if(clock.start)clock.start=Date.now();save();clockDraw()};
setInterval(clockDraw,1000);

function toggleKnown(id){if(S.known[id])delete S.known[id];else S.known[id]=1;save()}

function go(r,opt){stopSpeak();if(r!=="lessons")clockStop();room=r;try{history.replaceState(null,"","#"+r)}catch(e){}renderTabs();render(opt);clockDraw();window.scrollTo(0,0)}

function chipsFor(t){
  const c=[];
  if(S.known[t.id]) c.push(`<span class="chip ok">Got it down</span>`);
  if(S.times[t.id]>=1000) c.push(`<span class="chip">⏱ ${fmt(S.times[t.id])}</span>`);
  const q=S.quiz[t.id]; if(q) c.push(`<span class="chip ${q.r/q.n>=.8?"ok":"warn"}">Quiz ${q.r}/${q.n}</span>`);
  const s=S.test[t.id]; if(s!=null) c.push(`<span class="chip ${s>=80?"ok":"warn"}">Test ${s}%</span>`);
  if(!c.length) c.push(`<span class="chip">Not started</span>`);
  return c.join("");
}

/* Lessons: each lesson's slides end with a "Know these terms" recap slide. */
const allSlides = t => [...t.slides,{h:"Know these terms",terms:t.terms}];
function slideSpeech(t,s){

  return [t.title,s.h,...(s.p||[]),s.tip||"",...(s.terms||[]).map(([a,b])=>`${a}. ${b}`)].filter(Boolean).map(end).join(" ");

let slideIdx=0, lessonTopic=null, keyHandler=null;

    </div>
  </section>
  <div class="tts"><label>Voice <select id="voice">${voiceOpts()}</select></label>
    <label>Speed <select id="rate">${[0.75,1,1.25,1.5].map(r=>`<option value="${r}" ${r==S.tts.rate?"selected":""}>${r}×</option>`).join("")}</select></label>
    <label><input type="checkbox" id="auto" ${S.tts.auto?"checked":""}> Read each slide automatically</label>

  $("#auto").onchange=e=>{S.tts.auto=e.target.checked;save();if(S.tts.auto)speak(text,file)};

/* Flashcards: term on the front, definition on the back */
let deck=[], fi=0, flashFilter="all";
function buildDeck(){
  deck=shuffle(T.filter(t=>flashFilter==="all"||t.id===flashFilter).flatMap(t=>t.terms.map(c=>({t:t.title,q:c[0],a:c[1]}))));fi=0;
}
function flashRoom(app){
  if(!deck.length) buildDeck();
  const done=fi>=deck.length, c=deck[fi];
  app.innerHTML=`<div class="topic-pick"><button data-f="all" aria-pressed="${flashFilter==="all"}">All terms</button>${T.map((t,i)=>`<button data-f="${t.id}" aria-pressed="${flashFilter===t.id}">${i+1}. ${t.title}</button>`).join("")}</div>
  <div class="card-area">
    ${done?`<div class="qbox" style="text-align:center;width:min(560px,100%)"><h2>Deck cleared!</h2><p class="muted">Every card answered with "Got it."</p><button class="btn y" id="again">Shuffle again</button></div>`:`
    <p class="mono muted" style="margin:0">${deck.length} cards left</p>
    <button class="flash" id="card" aria-label="Flip card"><div class="in">
      <div class="face front"><small>${esc(c.t)}</small>${esc(c.q)}</div>
      <div class="face back"><small>${esc(c.t)}</small>${esc(c.a)}</div>
    </div></button>
    <div class="ctrl"><button class="btn ghost" id="miss">Again</button><button class="btn" id="flip">Flip</button><button class="btn y" id="got">Got it</button></div>
    <p class="muted" style="font-size:.88rem;margin:0">Say what the term means out loud before you flip. "Again" puts the card back in the deck.</p>`}
  </div>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{flashFilter=b.dataset.f;buildDeck();flashRoom(app)});
  if(done){$("#again").onclick=()=>{buildDeck();flashRoom(app)};return}
  const card=$("#card"); const flip=()=>card.classList.toggle("flipped");
  card.onclick=flip; $("#flip").onclick=flip;
  $("#got").onclick=()=>{deck.splice(fi,1);flashRoom(app)};
  $("#miss").onclick=()=>{const x=deck.splice(fi,1)[0];deck.push(x);flashRoom(app)};
}

function quizRoom(app){

  }
  const it=Q.items[Q.i];
  app.innerHTML=`<div class="qbox">
    <div class="score"><span>Question <b>${Q.i+1}</b>/${Q.items.length}</span><span>Points <b>${Q.pts}</b></span><span>Streak <b>${Q.streak}</b>${Q.streak>=3?" 🔥":""}</span></div>
    <div class="mono muted" style="font-size:.8rem">${esc(it.t)}</div>
    <h2>${esc(it.q)}</h2>
    ${mcView(it.opts,Q.pick,it.why,"Next question →",()=>"")}
  </div><p class="muted" style="font-size:.88rem">100 points per right answer, plus 50 for each answer in your current streak.</p>`;
  if(Q.pick!=null){$("#nq").onclick=()=>{Q.i++;Q.pick=null;quizRoom(app)};return}
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    Q.pick=+b.dataset.i; const o=it.opts[Q.pick];
    const rec=S.quiz[it.tid]||{r:0,n:0}; rec.n++;
    if(o.right){Q.streak++;Q.best=Math.max(Q.best,Q.streak);Q.pts+=100+50*(Q.streak-1);Q.right++;rec.r++}

    quizRoom(app); $("#nq").focus();
  });
}

/* Renders one multiple-choice question from a stored pick (null = unanswered). Keeping the pick in state means
   leaving the tab mid-question and coming back redraws the same state instead of leaving dead buttons. */
function mcView(opts,pick,why,nextLabel,extra){
  const o=pick!=null?opts[pick]:null;
  return `<div class="opts">${opts.map((x,j)=>`<button class="opt ${pick!=null&&x.right?"right":""} ${pick===j&&!x.right?"wrong":""}" data-i="${j}" ${pick!=null?"disabled":""}>${String.fromCharCode(65+j)}. ${esc(x.o)}</button>`).join("")}</div>
    ${o?`<div><p style="margin:0" class="${o.right?"":"why"}"><b style="color:${o.right?"var(--good)":"var(--bad)"}">${o.right?"Correct!":"Not quite."}</b> ${esc(why)}</p>
    <div class="ctrl" style="margin-top:10px"><button class="btn y" id="nq">${nextLabel}</button>${extra(o)}</div></div>`:""}`;
}

/* President Lineup */
const PRES=[["George Washington","1789–1797","Created the cabinet, two terms, Farewell Address"],

let L=null, resetTimer=null;
function newLineup(){let o;do{o=shuffle([...PRES.keys()])}while(o.every((v,i)=>v===i));L={order:o,solved:false,start:Date.now()}}
function lineupRoom(app){

    <span class="who"><b>${PRES[p][0]}</b>${hard&&!L.solved?"":`<small>${PRES[p][2]}</small>`}${L.solved?`<small class="yrs">${PRES[p][1]}</small>`:""}</span>
    <span class="arrows"><button data-mv="-1" aria-label="Move ${PRES[p][0]} up" ${i===0||L.solved?"disabled":""}>▲</button><button data-mv="1" aria-label="Move ${PRES[p][0]} down" ${i===NP-1||L.solved?"disabled":""}>▼</button></span></li>`).join("")}</ol>
  ${L.solved?`<p class="win">Correct! New round coming…</p>`:""}
  <div class="lstat"><span>In the right spot: <b id="lright">0</b>/${NP}</span><span>Rounds won: <b>${S.lineup.wins}</b></span><span>Best time: <b>${S.lineup.best?fmt(S.lineup.best):"–"}</b></span></div>
  <div class="tts"><label><input type="checkbox" id="hard" ${hard?"checked":""}> Hard mode: hide the clues</label><button class="btn ghost" id="shuf" style="padding:5px 12px">Shuffle</button></div>`;
  $("#lright").textContent=ord.filter((p,i)=>p===i).length;
  $("#hard").onchange=e=>{S.lineup.hard=e.target.checked;save();lineupRoom(app)};
  $("#shuf").onclick=()=>{clearTimeout(resetTimer);newLineup();lineupRoom(app)};
  if(L.solved) return;
  const list=$("#lineup");
  list.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    const i=[...list.children].indexOf(b.closest("li")), j=i+ +b.dataset.mv;
    [ord[i],ord[j]]=[ord[j],ord[i]]; checkLineup(app,`[data-p="${ord[j]}"] [data-mv="${b.dataset.mv}"]`);
  });
  /* Listeners live on document (not pointer capture) because moving the card in the DOM drops capture mid-drag. */
  let drag=null;
  const move=e=>{
    if(!drag)return; e.preventDefault();
    const li=drag.li, others=[...list.children].filter(x=>x!==li);
    const before=others.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});
    if(before!==li.nextElementSibling) list.insertBefore(li,before||null);
    li.style.transform=`translateY(${e.clientY-drag.y0-(li.offsetTop-drag.top0)}px) scale(1.02)`;
    [...list.children].forEach((x,i)=>x.querySelector(".slot").textContent=i+1);
  };
  const end=()=>{
    if(!drag)return; const li=drag.li; drag=null;
    li.classList.remove("drag"); li.style.transform="";
    document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",end); document.removeEventListener("pointercancel",end);
    L.order=[...list.children].map(x=>+x.dataset.p); checkLineup(app);
  };
  list.querySelectorAll(".pcard").forEach(li=>li.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")||e.button>0)return; e.preventDefault();
    drag={li,y0:e.clientY,top0:li.offsetTop}; li.classList.add("drag");
    document.addEventListener("pointermove",move,{passive:false}); document.addEventListener("pointerup",end); document.addEventListener("pointercancel",end);
  }));
}
function checkLineup(app,refocus){
  if(L.order.every((p,i)=>p===i)){
    L.solved=true;const t=Date.now()-L.start;
    S.lineup.wins++;if(!S.lineup.best||t<S.lineup.best)S.lineup.best=t;save();
    lineupRoom(app);confetti();
    clearTimeout(resetTimer);
    resetTimer=setTimeout(()=>{newLineup();if(room==="lineup")lineupRoom(app)},3200);
  }else{lineupRoom(app);const f=refocus&&$(refocus);if(f&&!f.disabled)f.focus()}
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  const x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=["#f2d675","#9fe0a8","#f2a3a0","#eef0e6","#8ec5ff","#ffb86b"];
  const P=Array.from({length:180},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(now){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(now-t0<3000)requestAnimationFrame(f);else c.remove();
  })(t0);
}

/* 40-question practice test: 4 random questions from each of the 10 lessons, graded at the end like the real thing. */
/* The test in progress is saved per viewer so a refresh or page update doesn't wipe answers. */
let P=(()=>{try{const p=JSON.parse(localStorage.getItem("er-u3-test"));return p&&p.qs?p:null}catch(e){return null}})(), timerId=null;
const saveP=()=>{try{localStorage.setItem("er-u3-test",JSON.stringify(P))}catch(e){}};
/* One-time seed: the questions the student said they were unsure about on the test they turned in before the Unsure flag existed. */
if(P&&P.graded&&!P.unsure){P.unsure=[11,16,22,24,37,38,40].map(n=>n-1);saveP()}
/* mode "new" = all 40 second-set questions; "mix" = 4 random per lesson from both sets (120 total). */
function newTest(mode="mix"){
  const pick=t=>mode==="new"?t.quiz2:shuffle([...t.quiz,...t.quiz2]).slice(0,4);
  P={set:mode,qs:shuffle(T.flatMap(t=>pick(t).map(q=>mkQ(t,q)))),ans:{},unsure:[],graded:false,warned:false,end:null};saveP();if(typeof R!=="undefined")R=null}
const isRight=i=>P.ans[i]!=null&&P.qs[i].opts[P.ans[i]].right;
function testRoom(app){
  if(!P) newTest("new");
  clearInterval(timerId);
  const N=P.qs.length, answered=Object.keys(P.ans).length, uns=new Set(P.unsure||[]);
  let summary="";
  if(P.graded){
    const right=P.qs.filter((q,i)=>P.ans[i]!=null&&q.opts[P.ans[i]].right).length, pct=Math.round(100*right/N);
    const letter=pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"F";
    const by=T.map(t=>{const qs=P.qs.map((q,i)=>[q,i]).filter(([q])=>q.tid===t.id);const r=qs.filter(([q,i])=>P.ans[i]!=null&&q.opts[P.ans[i]].right).length;return {t,r,n:qs.length}});
    summary=`<div style="display:grid;gap:10px"><div><span class="grade">${letter} · ${right}/${N} (${pct}%)</span></div>
      <p style="margin:0">${pct>=90?"Test-ready! Take a fresh one tomorrow to make sure it sticks.":"Review the lessons marked in red below, then take a new test."}</p>
      <div class="breakdown">${by.map(b=>`<span class="${b.r/b.n>=.75?"hi":"lo"}">${T.indexOf(b.t)+1}. ${esc(b.t.title)}: ${b.r}/${b.n}</span>`).join("")}</div></div>`;
  }
  app.innerHTML=`<div class="topic-pick" style="align-items:center">
    <button id="newall" aria-pressed="${P.set==="new"}">★ All-new 40 questions</button>
    <button id="newset" aria-pressed="${P.set==="mix"}">Mixed test (from all 120)</button>
    ${P.graded?"":`<button id="tmr" aria-pressed="${!!P.end}">${P.end?"Timer on":"Start 45-min timer"}</button>`}
    <span class="timer" id="clock"></span>
  </div>
  <form class="paper ${P.graded?"graded":""}" id="paper">
    <div><h2 style="font-size:1.9rem">Unit 3 Test · Early Republic</h2>
    <p style="margin:6px 0 0">${N} multiple-choice questions${P.set==="new"?" · all-new question set":P.set==="mix"?" · mixed from both question sets":""}. Choose the best answer. You'll see your score when you turn it in.</p></div>
    ${summary}
    <div style="display:grid;gap:6px"><span style="font-size:.85rem;color:#55625b">${P.graded?"Green = right, red = missed. Tap a number to jump to it.":"Dark = answered. Tap a number to jump to that question."}</span>
    <div class="qnav" id="qnav">${P.qs.map((q,i)=>`<button type="button" data-jump="${i}" class="${P.graded?(isRight(i)?"ok":"no"):P.ans[i]!=null?"done":""} ${uns.has(i)?"un":""}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div></div>
    ${P.qs.map((q,i)=>{const a=P.ans[i];return `<fieldset class="mcq ${a!=null?"answered":""}" id="q-${i}"><legend>${i+1}. ${esc(q.q)}${P.graded?`<span class="src">Lesson ${T.findIndex(t=>t.id===q.tid)+1}${uns.has(i)?" · marked unsure":""}</span>`:`<button type="button" class="flag" data-flag="${i}" aria-pressed="${uns.has(i)}">? Unsure</button>`}</legend>
      <div class="mopts">${q.opts.map((o,j)=>{const cls=(P.graded?(o.right?"is-right ":a===j?"is-wrong ":""):"")+(a===j?"sel":"");
        return `<label class="${cls}"><input type="radio" name="q${i}" value="${j}" ${a===j?"checked":""} ${P.graded?"disabled":""}> <span>${String.fromCharCode(65+j)}. ${esc(o.o)}</span></label>`}).join("")}</div>
      ${P.graded&&(a==null||!q.opts[a].right)?`<div class="expl"><b>${a==null?"Left blank.":"Missed."}</b> ${esc(q.why)}</div>`:""}
    </fieldset>`}).join("")}
    <div class="ctrl">${P.graded?`<button class="btn" type="button" id="retake" style="background:#23312b;color:#f6f1df">Take a new test</button>`
      :`<button class="btn" type="submit" style="background:#23312b;color:#f6f1df">${P.warned?"Turn it in anyway":"Turn it in"}</button>
        ${P.warned?`<span class="warn-line">You left ${N-answered} blank.</span>`:""}`}</div>
    ${P.graded?"":`<div class="sticky-count" id="count">Answered ${answered}/${N}</div>`}
  </form>`;
  $("#newset").onclick=()=>{newTest("mix");testRoom(app);scrollTo(0,0)};
  $("#newall").onclick=()=>{newTest("new");testRoom(app);scrollTo(0,0)};
  $("#qnav").onclick=e=>{const b=e.target.closest("[data-jump]");if(!b)return;const f=$("#q-"+b.dataset.jump);
    f.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"});const r=f.querySelector("input:checked")||f.querySelector("input");if(r&&!r.disabled)r.focus({preventScroll:true})};
  if(P.graded){$("#retake").onclick=()=>{newTest();testRoom(app);scrollTo(0,0)};return}
  $("#tmr").onclick=()=>{P.end=P.end?null:Date.now()+45*60*1000;saveP();testRoom(app)};
  $("#paper").addEventListener("click",e=>{const b=e.target.closest("[data-flag]");if(!b)return;const i=+b.dataset.flag;
    uns.has(i)?uns.delete(i):uns.add(i);P.unsure=[...uns];saveP();
    b.setAttribute("aria-pressed",uns.has(i));$(`#qnav [data-jump="${i}"]`).classList.toggle("un",uns.has(i))});
  const tick=()=>{const c=$("#clock");if(!c||!P.end){if(c)c.textContent="";return}
    const ms=Math.max(0,P.end-Date.now());c.textContent=ms?`${fmt(ms)} left`:"Time's up! Turn it in.";};
  tick(); timerId=setInterval(tick,1000);
  $("#paper").onchange=e=>{const m=(e.target.name||"").match(/^q(\d+)$/);if(!m)return;const i=+m[1];
    P.ans[i]=+e.target.value;saveP();
    const f=$("#q-"+i);f.classList.add("answered");f.querySelectorAll("label").forEach(l=>l.classList.toggle("sel",l.contains(e.target)));
    $(`#qnav [data-jump="${i}"]`).classList.add("done");
    $("#count").textContent=`Answered ${Object.keys(P.ans).length}/${N}`};
  $("#paper").onsubmit=e=>{e.preventDefault();
    if(Object.keys(P.ans).length<N&&!P.warned){P.warned=true;saveP();testRoom(app);return}
    P.graded=true;P.end=null;R=null;saveP();
    T.forEach(t=>{const qs=P.qs.map((q,i)=>[q,i]).filter(([q])=>q.tid===t.id);if(!qs.length)return;
      const pct=Math.round(100*qs.filter(([q,i])=>P.ans[i]!=null&&q.opts[P.ans[i]].right).length/qs.length);
      S.test[t.id]=Math.max(S.test[t.id]??0,pct)});
    save();testRoom(app);scrollTo(0,0);
    const right=P.qs.filter((q,i)=>P.ans[i]!=null&&q.opts[P.ans[i]].right).length;
    if(right/N>=.9) confetti();
  };
}

/* Test Retake: questions missed on the last graded test plus any marked unsure, one at a time with reshuffled answers and instant feedback. */
let R=null;
function retakePool(){if(!P||!P.graded)return [];const u=new Set(P.unsure||[]);return P.qs.map((q,i)=>i).filter(i=>!isRight(i)||u.has(i))}
function startRetake(list){R={list:shuffle(list),i:0,right:0,missed:[],pick:null,cur:null}}
function retakeRoom(app){
  if(!P||!P.graded){
    app.innerHTML=`<section class="hero"><h1 style="font-size:2.2rem">Test Retake</h1><p>Take and turn in the 40-Question Test first. Then this tab gives you another shot at the questions you missed or marked unsure.</p><div><button class="btn y" id="totest">Go to the 40-Question Test →</button></div></section>`;
    $("#totest").onclick=()=>go("test");return;
  }
  const u=new Set(P.unsure||[]);
  if(!R){
    const pool=retakePool(), missed=P.qs.filter((q,i)=>!isRight(i)).length;
    app.innerHTML=`<section class="hero" style="padding-bottom:0"><h1 style="font-size:clamp(1.9rem,5vw,2.8rem)">Test Retake</h1>
      <p>The questions you missed on your last test, plus the ones you weren't sure about. The answer choices are reshuffled, and you'll see the right answer after each one.</p></section>
      <div class="qbox">
        <div class="muted" style="font-size:.9rem">Red = missed (always included). Yellow = unsure. Tap a green number to add it, or a yellow one to take it out.</div>
        <div class="qnav rt" id="rgrid">${P.qs.map((q,i)=>`<button type="button" data-r="${i}" class="${!isRight(i)?"no":u.has(i)?"un":"ok"}" ${!isRight(i)?"disabled":""} aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
        <div class="score"><span>Missed <b>${missed}</b></span><span>Unsure <b>${pool.length-missed}</b></span><span>Retake <b>${pool.length}</b> questions</span></div>
        <div class="ctrl"><button class="btn y" id="rstart" ${pool.length?"":"disabled"}>Start retake →</button></div>
      </div>`;
    $("#rgrid").onclick=e=>{const b=e.target.closest("[data-r]");if(!b||b.disabled)return;const i=+b.dataset.r;
      u.has(i)?u.delete(i):u.add(i);P.unsure=[...u];saveP();retakeRoom(app)};
    $("#rstart").onclick=()=>{startRetake(pool);retakeRoom(app)};
    return;
  }
  if(R.i>=R.list.length){
    const n=R.list.length;
    app.innerHTML=`<div class="qbox" style="text-align:center"><h2 style="font-family:var(--f-display);font-size:2rem">Retake score: ${R.right}/${n}</h2>
      <p class="muted">${R.missed.length?`Still missing ${R.missed.length}. Run just those again, or review their lessons.`:"Every one right this time!"}</p>
      <div class="ctrl" style="justify-content:center">${R.missed.length?`<button class="btn y" id="again">Retake the ${R.missed.length} I missed</button>`:""}<button class="btn ghost" id="back">Back to the list</button></div></div>`;
    if(R.missed.length) $("#again").onclick=()=>{startRetake(R.missed);retakeRoom(app)}; else confetti();
    $("#back").onclick=()=>{R=null;retakeRoom(app)};
    return;
  }
  const idx=R.list[R.i], q=P.qs[idx], ln=T.findIndex(t=>t.id===q.tid);
  if(!R.cur) R.cur=shuffle(q.opts);
  app.innerHTML=`<div class="qbox">
    <div class="score"><span>Question <b>${R.i+1}</b>/${R.list.length}</span><span>Right <b>${R.right}</b></span></div>
    <div class="chips" style="align-items:center">${!isRight(idx)?`<span class="chip" style="border-color:var(--bad);color:var(--bad)">Missed</span>`:`<span class="chip warn">Unsure</span>`}<span class="mono muted" style="font-size:.8rem">#${idx+1} on your test · Lesson ${ln+1}</span></div>
    <h2>${esc(q.q)}</h2>
    ${mcView(R.cur,R.pick,q.why,R.i+1<R.list.length?"Next question →":"See my score →",o=>o.right?"":`<button class="btn ghost" id="rv">Review Lesson ${ln+1}</button>`)}
  </div>`;
  if(R.pick!=null){
    $("#nq").onclick=()=>{R.i++;R.pick=null;R.cur=null;retakeRoom(app)};
    const rv=$("#rv"); if(rv) rv.onclick=()=>go("lessons",{topic:q.tid});
    return;
  }
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    R.pick=+b.dataset.i;
    if(R.cur[R.pick].right)R.right++;else R.missed.push(idx);
    retakeRoom(app); $("#nq").focus();
  });
}

renderTabs(); render();
</script>
